<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PheNode by Agrela — Hyperlocal Environmental Intelligence</title>
    <meta name="description" content="PheNode is a flexible, scalable environmental monitoring platform: wireless sensor nodes, a solar-powered base station, and software that turns field measurements into usable data, normalized to your preferences." />
    <meta name="theme-color" content="#0E1012" />
    <!-- The Agrela mark (Nov 18). PNG and ICO only: Safari and Slack don't show SVG icons. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Link previews (Slack, iMessage, LinkedIn, X…). Their crawlers read these tags without running the site's code,
         so the build writes every page an HTML file of its own with its own title and description in them (sitePages in
         vite.config.js, from src/data/pageMeta.js; the home page's are the ones here). The image needs a full address:
         vite.config.js fills in SITE_URL. -->
    <meta property="og:site_name" content="PheNode by Agrela" />
    <meta property="og:title" content="PheNode by Agrela — Hyperlocal Environmental Intelligence" />
    <meta property="og:description" content="Wireless sensor nodes, a solar-powered base station and software, built as one system. Measure where conditions actually change." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The PheNode base station and its sensors, beside the words Hyperlocal Environmental Intelligence." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PheNode by Agrela — Hyperlocal Environmental Intelligence" />
    <meta name="twitter:description" content="Wireless sensor nodes, a solar-powered base station and software, built as one system. Measure where conditions actually change." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />
    <!-- Structured data for search engines (Nov 24): who makes PheNode, and the site's name. The facts are those in
         src/data/company.js; the logo is the Agrela mark. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%SITE_URL%/#organization",
            "name": "Agrela Ecosystems",
            "alternateName": "Agrela",
            "url": "%SITE_URL%/",
            "logo": "%SITE_URL%/icon-192.png",
            "foundingDate": "2016",
            "description": "Agrela Ecosystems makes PheNode, a flexible, scalable environmental monitoring platform. Founded in 2016 by plant scientists at the Donald Danforth Plant Science Center in St. Louis.",
            "sameAs": ["https://www.agrelaeco.com"]
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "name": "PheNode by Agrela",
            "url": "%SITE_URL%/",
            "publisher": { "@id": "%SITE_URL%/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
